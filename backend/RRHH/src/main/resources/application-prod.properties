# ===============================
# PRODUCCION - AZURE
# Todas las variables deben estar
# configuradas en App Service > Settings > Configuration
# ===============================

# Base de datos (Azure Database for PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}

# Mail
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Frontend (Azure Static Web Apps URL)
app.frontend-url=${FRONTEND_URL}

# En produccion solo se permite el frontend real (arriba), no localhost
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Archivos (Azure Blob Storage path o volumen persistente)
app.upload-dir=${UPLOAD_DIR:/home/uploads/evidencias}

# Azure Blob Storage (evidencias de justificaciones)
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:evidencias}

# Cookie - HTTPS cross-site para Azure
cookie.secure=true
cookie.same-site=None

# JPA - sin logs en produccion
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.validate-on-migrate=true

# Usuarios de prueba sin autenticacion - DESACTIVADO en produccion
sistema.usuarios-prueba=
